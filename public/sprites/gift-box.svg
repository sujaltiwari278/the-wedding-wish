<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 32" width="128" height="32" shape-rendering="crispEdges">
  <!-- PIXEL GIFT BOX SPRITE SHEET: 4 frames, 32x32 each -->
  <!-- FRAME 0: Closed gift box with gold ribbon -->
  <g id="frame0" transform="translate(0, 0)">
    <!-- Ribbon Bow on top -->
    <rect x="13" y="6" width="3" height="3" fill="#FBBF24" />
    <rect x="16" y="6" width="3" height="3" fill="#FBBF24" />
    <!-- Box Lid -->
    <rect x="6" y="9" width="20" height="5" fill="#9C5968" />
    <rect x="14" y="9" width="4" height="5" fill="#FBBF24" />
    <!-- Box Base -->
    <rect x="7" y="14" width="18" height="13" fill="#D8A7A7" />
    <rect x="14" y="14" width="4" height="13" fill="#FBBF24" />
    <!-- Shadow -->
    <rect x="7" y="26" width="18" height="2" fill="#75404F" />
  </g>

  <!-- FRAME 1: Ribbon untying / slight squish -->
  <g id="frame1" transform="translate(32, 0)">
    <!-- Bow flutter -->
    <rect x="11" y="4" width="4" height="4" fill="#FBBF24" />
    <rect x="17" y="4" width="4" height="4" fill="#FBBF24" />
    <!-- Box Lid jitter -->
    <rect x="5" y="10" width="22" height="4" fill="#9C5968" />
    <rect x="14" y="10" width="4" height="4" fill="#FBBF24" />
    <rect x="6" y="14" width="20" height="13" fill="#D8A7A7" />
    <rect x="14" y="14" width="4" height="13" fill="#FBBF24" />
    <rect x="6" y="26" width="20" height="2" fill="#75404F" />
  </g>

  <!-- FRAME 2: Lid pops open -->
  <g id="frame2" transform="translate(64, 0)">
    <!-- Floating popped lid -->
    <rect x="5" y="3" width="22" height="5" fill="#9C5968" />
    <rect x="14" y="3" width="4" height="5" fill="#FBBF24" />
    <!-- Interior light glow -->
    <rect x="9" y="8" width="14" height="4" fill="#FFF7F2" />
    <!-- Box Base -->
    <rect x="7" y="12" width="18" height="15" fill="#D8A7A7" />
    <rect x="14" y="12" width="4" height="15" fill="#FBBF24" />
    <rect x="7" y="26" width="18" height="2" fill="#75404F" />
  </g>

  <!-- FRAME 3: Surprise stars / hearts burst out -->
  <g id="frame3" transform="translate(96, 0)">
    <!-- Popped lid angled -->
    <rect x="4" y="1" width="16" height="5" fill="#9C5968" />
    <!-- Bursting stars -->
    <rect x="15" y="2" width="3" height="3" fill="#FBBF24" />
    <rect x="23" y="4" width="3" height="3" fill="#FBBF24" />
    <rect x="14" y="7" width="4" height="4" fill="#9C5968" /> <!-- heart -->
    <!-- Box Base -->
    <rect x="7" y="12" width="18" height="15" fill="#D8A7A7" />
    <rect x="14" y="12" width="4" height="15" fill="#FBBF24" />
    <rect x="7" y="26" width="18" height="2" fill="#75404F" />
  </g>
</svg>