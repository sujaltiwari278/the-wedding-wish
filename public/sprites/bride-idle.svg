<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 48" width="128" height="48" shape-rendering="crispEdges">
  <!-- BRIDE IDLE SPRITE SHEET: 4 frames, 32x48 each -->
  <!-- FRAME 0: Idle Standing, Eyes Open -->
  <g id="frame0" transform="translate(0, 0)">
    <!-- Hair / Dupatta drape background -->
    <rect x="9" y="8" width="14" height="26" fill="#75404F" />
    <rect x="8" y="10" width="16" height="24" fill="#9C5968" />
    <!-- Face / Neck -->
    <rect x="11" y="11" width="10" height="11" fill="#F7E9E5" />
    <!-- Hair fringe -->
    <rect x="11" y="9" width="10" height="3" fill="#2B1810" />
    <!-- Maang tikka & bindi -->
    <rect x="15" y="9" width="2" height="3" fill="#FBBF24" />
    <rect x="15" y="13" width="2" height="2" fill="#9C5968" />
    <!-- Eyes (Open) -->
    <rect x="13" y="15" width="2" height="2" fill="#2B1810" />
    <rect x="17" y="15" width="2" height="2" fill="#2B1810" />
    <!-- Blush cheeks -->
    <rect x="12" y="17" width="2" height="1" fill="#EBCACA" />
    <rect x="18" y="17" width="2" height="1" fill="#EBCACA" />
    <!-- Smile -->
    <rect x="15" y="18" width="2" height="1" fill="#9C5968" />
    <!-- Gold necklace / choker -->
    <rect x="13" y="21" width="6" height="2" fill="#FBBF24" />
    <!-- Choli (blouse) -->
    <rect x="11" y="23" width="10" height="6" fill="#9C5968" />
    <rect x="13" y="23" width="6" height="2" fill="#FBBF24" />
    <!-- Waist midriff -->
    <rect x="13" y="29" width="6" height="2" fill="#F7E9E5" />
    <!-- Lehenga skirt -->
    <rect x="10" y="31" width="12" height="4" fill="#D8A7A7" />
    <rect x="8" y="35" width="16" height="5" fill="#D8A7A7" />
    <rect x="7" y="40" width="18" height="6" fill="#9C5968" />
    <!-- Gold border on lehenga hem -->
    <rect x="6" y="46" width="20" height="2" fill="#FBBF24" />
    <!-- Dupatta folds -->
    <rect x="7" y="13" width="2" height="20" fill="#D8A7A7" />
    <rect x="23" y="13" width="2" height="20" fill="#D8A7A7" />
    <rect x="7" y="32" width="2" height="6" fill="#FBBF24" />
  </g>

  <!-- FRAME 1: Breathing in (+1px chest lift, subtle sway) -->
  <g id="frame1" transform="translate(32, 0)">
    <rect x="9" y="7" width="14" height="27" fill="#75404F" />
    <rect x="8" y="9" width="16" height="25" fill="#9C5968" />
    <rect x="11" y="10" width="10" height="11" fill="#F7E9E5" />
    <rect x="11" y="8" width="10" height="3" fill="#2B1810" />
    <rect x="15" y="8" width="2" height="3" fill="#FBBF24" />
    <rect x="15" y="12" width="2" height="2" fill="#9C5968" />
    <rect x="13" y="14" width="2" height="2" fill="#2B1810" />
    <rect x="17" y="14" width="2" height="2" fill="#2B1810" />
    <rect x="12" y="16" width="2" height="1" fill="#EBCACA" />
    <rect x="18" y="16" width="2" height="1" fill="#EBCACA" />
    <rect x="15" y="17" width="2" height="1" fill="#9C5968" />
    <rect x="13" y="20" width="6" height="2" fill="#FBBF24" />
    <rect x="11" y="22" width="10" height="6" fill="#9C5968" />
    <rect x="13" y="22" width="6" height="2" fill="#FBBF24" />
    <rect x="13" y="28" width="6" height="2" fill="#F7E9E5" />
    <rect x="10" y="30" width="12" height="5" fill="#D8A7A7" />
    <rect x="8" y="35" width="16" height="5" fill="#D8A7A7" />
    <rect x="7" y="40" width="18" height="6" fill="#9C5968" />
    <rect x="6" y="46" width="20" height="2" fill="#FBBF24" />
    <!-- Dupatta sway -->
    <rect x="6" y="12" width="2" height="21" fill="#D8A7A7" />
    <rect x="24" y="12" width="2" height="21" fill="#D8A7A7" />
  </g>

  <!-- FRAME 2: Blinking (eyes closed) -->
  <g id="frame2" transform="translate(64, 0)">
    <rect x="9" y="8" width="14" height="26" fill="#75404F" />
    <rect x="8" y="10" width="16" height="24" fill="#9C5968" />
    <rect x="11" y="11" width="10" height="11" fill="#F7E9E5" />
    <rect x="11" y="9" width="10" height="3" fill="#2B1810" />
    <rect x="15" y="9" width="2" height="3" fill="#FBBF24" />
    <rect x="15" y="13" width="2" height="2" fill="#9C5968" />
    <!-- Eyes (Blinking horizontal line) -->
    <rect x="13" y="16" width="2" height="1" fill="#2B1810" />
    <rect x="17" y="16" width="2" height="1" fill="#2B1810" />
    <rect x="12" y="17" width="2" height="1" fill="#EBCACA" />
    <rect x="18" y="17" width="2" height="1" fill="#EBCACA" />
    <rect x="15" y="18" width="2" height="1" fill="#9C5968" />
    <rect x="13" y="21" width="6" height="2" fill="#FBBF24" />
    <rect x="11" y="23" width="10" height="6" fill="#9C5968" />
    <rect x="13" y="23" width="6" height="2" fill="#FBBF24" />
    <rect x="13" y="29" width="6" height="2" fill="#F7E9E5" />
    <rect x="10" y="31" width="12" height="4" fill="#D8A7A7" />
    <rect x="8" y="35" width="16" height="5" fill="#D8A7A7" />
    <rect x="7" y="40" width="18" height="6" fill="#9C5968" />
    <rect x="6" y="46" width="20" height="2" fill="#FBBF24" />
    <rect x="7" y="13" width="2" height="20" fill="#D8A7A7" />
    <rect x="23" y="13" width="2" height="20" fill="#D8A7A7" />
  </g>

  <!-- FRAME 3: Dupatta sway back, peaceful smile -->
  <g id="frame3" transform="translate(96, 0)">
    <rect x="9" y="8" width="14" height="26" fill="#75404F" />
    <rect x="8" y="10" width="16" height="24" fill="#9C5968" />
    <rect x="11" y="11" width="10" height="11" fill="#F7E9E5" />
    <rect x="11" y="9" width="10" height="3" fill="#2B1810" />
    <rect x="15" y="9" width="2" height="3" fill="#FBBF24" />
    <rect x="15" y="13" width="2" height="2" fill="#9C5968" />
    <rect x="13" y="15" width="2" height="2" fill="#2B1810" />
    <rect x="17" y="15" width="2" height="2" fill="#2B1810" />
    <rect x="12" y="17" width="2" height="1" fill="#EBCACA" />
    <rect x="18" y="17" width="2" height="1" fill="#EBCACA" />
    <!-- Cheerful smile -->
    <rect x="14" y="18" width="4" height="1" fill="#9C5968" />
    <rect x="13" y="21" width="6" height="2" fill="#FBBF24" />
    <rect x="11" y="23" width="10" height="6" fill="#9C5968" />
    <rect x="13" y="23" width="6" height="2" fill="#FBBF24" />
    <rect x="13" y="29" width="6" height="2" fill="#F7E9E5" />
    <rect x="10" y="31" width="12" height="4" fill="#D8A7A7" />
    <rect x="8" y="35" width="16" height="5" fill="#D8A7A7" />
    <rect x="7" y="40" width="18" height="6" fill="#9C5968" />
    <rect x="6" y="46" width="20" height="2" fill="#FBBF24" />
    <rect x="8" y="13" width="2" height="20" fill="#D8A7A7" />
    <rect x="22" y="13" width="2" height="20" fill="#D8A7A7" />
  </g>
</svg>